spring.application.name=telegrambot
spring.profiles.default=local
spring.profiles.group.production=prod

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.data.jdbc.dialect=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

dailyscheduleupdate.cron=${DAILY_UPDATE_CRON:0 0 0 * * *}
logging.level.web=INFO

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=180000
spring.datasource.hikari.leak-detection-threshold=150000

server.tomcat.threads.max=20
maximum.group.parallel=${GROUP_MAXIMUM_PARALLELISM:2}
maximum.dayparse.parallel=${DAY_PARSE_MAXIMUM_PARALLELISM:2}

server.port=8081
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.auth.token-secret=${TELEGRAM_AUTH_TOKEN_SECRET:}
telegram.auth.init-data-max-age-seconds=${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:300}
telegram.auth.access-token-ttl-seconds=${TELEGRAM_ACCESS_TOKEN_TTL_SECONDS:3600}
mini-app.allowed-origins=${MINI_APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
semester.start=${SEMESTER_START:2026-09-01}
semester.end=${SEMESTER_END:2027-01-31}
springdoc.swagger-ui.try-it-out-enabled=false
springdoc.swagger-ui.supported-submit-methods=[GET]

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-migration-naming=true

logging.level.org.springframework.transaction=DEBUG
spring.cache.caffeine.spec=expireAfterWrite=5d,maximumSize=1000


spring.docker.compose.enabled=false

#metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.app=telegram-bot
management.metrics.tags.env=dev
management.metrics.distribution.percentiles.http.client.requests:0.95,0.99
management.metrics.distribution.percentiles-histogram.http.client.requests:true
